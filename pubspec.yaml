  fpdart: ^1.2.0
  intl: ^0.20.2
  uuid: ^4.5.3
  forui: ^0.21.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.14.1
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0
